# Production configuration
# Usage: docker compose up (with COMPOSE_FILE=compose.prod.yml in .env)

include:
  - compose.yml

services:
  gemini-mcp-relay:
    networks:
      - default
      - server-net
      - mcp-net

networks:
  default:
  server-net:
    external: true
  mcp-net:
    name: mcp-net
